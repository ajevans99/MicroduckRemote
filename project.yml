name: MicroduckRemote
options:
  bundleIdPrefix: dev.ajevans
  deploymentTarget:
    iOS: "27.3"
  xcodeVersion: "16.0"
packages:
  MicroduckRemotePackage:
    path: MicroduckRemotePackage
targets:
  MicroduckRemote:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ajevans.microduckremote
        DEVELOPMENT_TEAM: 3Z68NFJBHS
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Microduck"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scans rooms on-device using the camera and LiDAR scanner with Apple RoomPlan to build MuJoCo XML scenes for Microduck."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to your Microduck simulator or robot over your local network."
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Microduck
        UILaunchScreen: {}
        NSCameraUsageDescription: "Scans rooms on-device using the camera and LiDAR scanner with Apple RoomPlan to build MuJoCo XML scenes for Microduck."
        NSLocalNetworkUsageDescription: "Connects to your Microduck simulator or robot over your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: dev.ajevans.microduckremote.oauth
            CFBundleURLSchemes:
              - microduckremote
    entitlements:
      path: MicroduckRemote.entitlements
      properties:
        com.apple.security.application-groups:
          - group.dev.ajevans.microduckremote
    dependencies:
      - package: MicroduckRemotePackage
        product: AppFeature
      - package: MicroduckRemotePackage
        product: DuckDependencies
      - package: MicroduckRemotePackage
        product: DuckIntents
      - package: MicroduckRemotePackage
        product: DuckWebRTC
      - package: MicroduckRemotePackage
        product: RoomScanFeature
schemes:
  MicroduckRemote:
    build:
      targets:
        MicroduckRemote: all
    run:
      config: Debug
