name: MicroduckRemote
options:
  bundleIdPrefix: com.pollenrobotics
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "16.0"
packages:
  MicroduckRemotePackage:
    path: MicroduckRemotePackage
targets:
  MicroduckRemote:
    type: application
    platform: iOS
    sources:
      - path: App
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pollenrobotics.microduckremote
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Microduck"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to your Microduck simulator or robot over your local network."
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Microduck
        UILaunchScreen: {}
        NSLocalNetworkUsageDescription: "Connects to your Microduck simulator or robot over your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: com.pollenrobotics.microduckremote.oauth
            CFBundleURLSchemes:
              - microduckremote
    dependencies:
      - package: MicroduckRemotePackage
        product: AppFeature
      - package: MicroduckRemotePackage
        product: DuckDependencies
      - package: MicroduckRemotePackage
        product: DuckWebRTC
schemes:
  MicroduckRemote:
    build:
      targets:
        MicroduckRemote: all
    run:
      config: Debug
