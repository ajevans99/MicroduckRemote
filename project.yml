name: MicroduckRemote
fileTypes:
  skillsbundle:
    file: true
    buildPhase: resources
    explicitFileType: wrapper.skillsbundle
options:
  bundleIdPrefix: com.microduck
  deploymentTarget:
    iOS: "27.3"
    macOS: "27.3"
  xcodeVersion: "16.0"
configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig
packages:
  MicroduckRemotePackage:
    path: MicroduckRemotePackage
targets:
  MicroduckRemote:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info-macOS.plist
          - Skills.skillsbundle
      - path: App/Skills.skillsbundle
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_CFBundleDisplayName: "Microduck"
        INFOPLIST_KEY_NSCameraUsageDescription: "Scans rooms on-device using the camera and LiDAR scanner with Apple RoomPlan to build MuJoCo XML scenes for Microduck."
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to your Microduck simulator or robot over your local network."
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Microduck
        UILaunchScreen: {}
        NSCameraUsageDescription: "Scans rooms on-device using the camera and LiDAR scanner with Apple RoomPlan to build MuJoCo XML scenes for Microduck."
        NSLocalNetworkUsageDescription: "Connects to your Microduck simulator or robot over your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - microduckremote
    entitlements:
      path: MicroduckRemote.entitlements
      properties:
        com.apple.security.application-groups:
          - group.$(PRODUCT_BUNDLE_IDENTIFIER)
    dependencies:
      - package: MicroduckRemotePackage
        product: AppFeature
      - package: MicroduckRemotePackage
        product: DuckDependencies
      - package: MicroduckRemotePackage
        product: DuckIntents
      - package: MicroduckRemotePackage
        product: DuckWebRTC
      - package: MicroduckRemotePackage
        product: RoomScanFeature
  MicroduckRemoteMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Info.plist
          - Skills.skillsbundle
      - path: App/Skills.skillsbundle
        type: file
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: Microduck
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        INFOPLIST_KEY_CFBundleDisplayName: "Microduck"
        INFOPLIST_KEY_LSApplicationCategoryType: "public.app-category.utilities"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "Connects to your Microduck simulator or robot over your local network."
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
    info:
      path: App/Info-macOS.plist
      properties:
        CFBundleDisplayName: Microduck
        LSApplicationCategoryType: public.app-category.utilities
        NSLocalNetworkUsageDescription: "Connects to your Microduck simulator or robot over your local network."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER).oauth
            CFBundleURLSchemes:
              - microduckremote
    entitlements:
      path: MicroduckRemoteMac.entitlements
      properties:
        com.apple.security.app-sandbox: false
    dependencies:
      - package: MicroduckRemotePackage
        product: AppFeature
      - package: MicroduckRemotePackage
        product: DuckDependencies
      - package: MicroduckRemotePackage
        product: DuckIntents
      - package: MicroduckRemotePackage
        product: DuckWebRTC
      - package: MicroduckRemotePackage
        product: RoomScanFeature
      - package: MicroduckRemotePackage
        product: SimulatorFeature
  MicroduckSiriEvaluations:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "27.3"
    sources:
      - path: MicroduckSiriEvaluations
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).sirieval
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        TEST_TARGET_NAME: MicroduckRemoteMac
    dependencies:
      - target: MicroduckRemoteMac
schemes:
  MicroduckRemote:
    build:
      targets:
        MicroduckRemote: all
    run:
      config: Debug
  MicroduckRemoteMac:
    build:
      targets:
        MicroduckRemoteMac: all
        MicroduckSiriEvaluations: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - MicroduckSiriEvaluations
